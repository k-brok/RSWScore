<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{Subject}}</title>
  <style>
    /* Basis, inlined wordt vaak beter ondersteund; houd het eenvoudig */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background:#f4f6f8; margin:0; padding:20px; color:#0f1720; }
    .container { max-width:600px; margin:24px auto; background:#ffffff; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(15,23,32,0.08); }
    .header { padding:20px 24px; background:linear-gradient(90deg,#0ea5a3,#0284c7); color:#fff; }
    .logo { font-weight:700; letter-spacing:0.2px; }
    .content { padding:24px; }
    h1 { font-size:20px; margin:0 0 8px; }
    p { margin:0 0 16px; line-height:1.5; color:#263238; }
    .btn-wrap { text-align:center; margin:18px 0; }
    .btn { display:inline-block; text-decoration:none; padding:12px 20px; border-radius:6px; background:#0ea5a3; color:#fff; font-weight:600; }
    .note { font-size:13px; color:#64748b; }
    .footer { padding:16px 24px; font-size:13px; color:#94a3b8; background:#fafbfd; }
    .muted { color:#6b7280; font-size:13px; }
    a.inline { color:#0284c7; text-decoration:underline; }
    @media (max-width:420px) {
      .container { margin:12px; }
      .header, .content, .footer { padding-left:16px; padding-right:16px; }
    }
  </style>
</head>
<body>
  <div class="container" role="article" aria-label="{{Subject}}">
    <div class="header">
      <div class="logo">RegioDeLangstraat</div>
    </div>

    <div class="content">
      {{Content}}
    </div>

    <div class="footer">
      <div>© {{year}} RegioDeLangstraat — Alle rechten voorbehouden.</div>
    </div>
  </div>
</body>
</html>
